apiVersion: apps/v1
kind: Deployment
metadata:
  name: universal-matrix-engine
  labels:
    app: matrix-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matrix-engine
  template:
    metadata:
      labels:
        app: matrix-engine
    spec:
      containers:
      - name: matrix-engine
        image: ghcr.io/water/universal-matrix:latest
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "1000m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /metrics
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-engine-service
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: matrix-engine