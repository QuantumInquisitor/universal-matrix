events {
    worker_connections 1024;
}

http {
    upstream matrix_backend {
        server matrix_engine:8000;
    }

    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Standard API and Dashboard HTTP endpoints
        location / {
            proxy_pass http://matrix_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Bi-Directional WebSocket Telemetry Endpoint (wss://)
        location /ws/telemetry {
            proxy_pass http://matrix_backend/ws/telemetry;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Server-Sent Events (SSE) Telemetry Stream (https://)
        location /api/v1/telemetry/stream {
            proxy_pass http://matrix_backend/api/v1/telemetry/stream;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}