<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Matrix Engine | Telemetry Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --border-color: #1f2937;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h1 { margin: 0; font-size: 1.5rem; letter-spacing: 1px; }
        .status-badge {
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            border: 1px solid var(--accent-green);
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        .card h3 { margin: 0 0 10px 0; color: var(--text-sub); font-size: 0.85rem; text-transform: uppercase; }
        .card .metric { font-size: 1.8rem; font-weight: bold; color: var(--text-main); }
        .chart-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            height: 380px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🌌 UNIVERSAL MATRIX ENGINE TELEMETRY</h1>
        <div id="connection-status" class="status-badge">CONNECTING...</div>
    </div>

    <div class="metrics-grid">
        <div class="card">
            <h3>Matrix Step Count</h3>
            <div id="metric-step" class="metric">0</div>
        </div>
        <div class="card">
            <h3>Active Matrix Nodes</h3>
            <div id="metric-nodes" class="metric">114</div>
        </div>
        <div class="card">
            <h3>Current Clock Drift</h3>
            <div id="metric-drift" class="metric">0.0000 ns</div>
        </div>
        <div class="card">
            <h3>Lattice Normalization</h3>
            <div id="metric-norm" class="metric">1.0000</div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="driftChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('driftChart').getContext('2d');
        const driftChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Clock Drift Variance (ns)',
                    data: [],
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { color: '#1f2937' }, ticks: { color: '#9ca3af' } },
                    y: { grid: { color: '#1f2937' }, ticks: { color: '#9ca3af' } }
                },
                plugins: {
                    legend: { labels: { color: '#f9fafb' } }
                }
            }
        });

        const eventSource = new EventSource('/api/v1/telemetry/stream');

        eventSource.onopen = () => {
            const badge = document.getElementById('connection-status');
            badge.innerText = 'SSE STREAM LIVE';
            badge.style.color = '#10b981';
            badge.style.borderColor = '#10b981';
        };

        eventSource.onmessage = (event) => {
            const data = JSON.parse(event.data);

            document.getElementById('metric-step').innerText = data.step;
            document.getElementById('metric-nodes').innerText = data.active_nodes;
            document.getElementById('metric-drift').innerText = data.clock_drift_ns + ' ns';
            document.getElementById('metric-norm').innerText = data.norm_sum.toFixed(4);

            driftChart.data.labels.push('Step ' + data.step);
            driftChart.data.datasets[0].data.push(data.clock_drift_ns);

            if (driftChart.data.labels.length > 20) {
                driftChart.data.labels.shift();
                driftChart.data.datasets[0].data.shift();
            }

            driftChart.update('none');
        };

        eventSource.onerror = () => {
            const badge = document.getElementById('connection-status');
            badge.innerText = 'STREAM DISCONNECTED';
            badge.style.color = '#ef4444';
            badge.style.borderColor = '#ef4444';
        };
    </script>
</body>
</html>
