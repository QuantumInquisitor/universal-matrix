<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Universal Matrix Engine - 3D WebGL Telemetry</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #05050a; font-family: monospace; color: #00ffcc; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui-panel {
            position: absolute; top: 15px; left: 15px; background: rgba(10, 15, 30, 0.85);
            padding: 20px; border: 1px solid #00ffcc; border-radius: 8px; width: 280px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 11px; text-transform: uppercase; margin-bottom: 4px; }
        input[type=range] { width: 100%; accent-color: #00ffcc; }
        .stats { font-size: 12px; margin-top: 10px; border-top: 1px solid #334455; padding-top: 8px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-panel">
        <h3>🌌 SO(13) 3D Viewport</h3>
        <div class="control-group">
            <label>Rotation Angle (<span id="angle-val">0.042</span>)</label>
            <input type="range" id="angle-slider" min="0.001" max="0.2" step="0.001" value="0.042">
        </div>
        <div class="control-group">
            <label>Step Delay (<span id="delay-val">0.05</span>s)</label>
            <input type="range" id="delay-slider" min="0.01" max="0.5" step="0.01" value="0.05">
        </div>
        <div class="stats">
            <div>Step: <span id="stat-step">0</span></div>
            <div>Clock Drift: <span id="stat-drift">0</span> ns</div>
            <div>Active Nodes: <span>114</span></div>
        </div>
    </div>

    <script>
        // --- Three.js Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        camera.position.set(0, 0, 15);

        // Grid & Node Mesh Generation (114 Nodes)
        const nodeGeometry = new THREE.SphereGeometry(0.15, 16, 16);
        const nodeMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
        const nodesGroup = new THREE.Group();
        const nodeMeshes = [];

        for (let i = 0; i < 114; i++) {
            const mesh = new THREE.Mesh(nodeGeometry, nodeMaterial);
            nodesGroup.add(mesh);
            nodeMeshes.push(mesh);
        }
        scene.add(nodesGroup);

        // --- WebSocket Telemetry & Control ---
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${wsProtocol}//${window.location.host}/ws/telemetry`);

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            document.getElementById('stat-step').innerText = data.step;
            document.getElementById('stat-drift').innerText = data.clock_drift_ns.toFixed(2);

            // Update 3D node positions from SO(13) matrix telemetry
            if (data.nodes) {
                data.nodes.forEach((node, i) => {
                    if (nodeMeshes[i]) {
                        nodeMeshes[i].position.set(node.x, node.y, node.z);
                    }
                });
            }
        };

        // --- Interactive Controls ---
        const angleSlider = document.getElementById('angle-slider');
        const delaySlider = document.getElementById('delay-slider');

        angleSlider.oninput = () => {
            document.getElementById('angle-val').innerText = angleSlider.value;
            socket.send(JSON.stringify({ rotation_angle: angleSlider.value }));
        };

        delaySlider.oninput = () => {
            document.getElementById('delay-val').innerText = delaySlider.value;
            socket.send(JSON.stringify({ step_delay: delaySlider.value }));
        };

        // Render Loop
        function animate() {
            requestAnimationFrame(animate);
            nodesGroup.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
