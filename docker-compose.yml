services:
  matrix-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: universal_matrix_engine
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - matrix_data:/app/data
      - matrix_logs:/app/logs
    environment:
      PYTHONUNBUFFERED: "1"
      UNIVERSAL_MATRIX_API_KEYS: "${UNIVERSAL_MATRIX_API_KEYS:-}"
      UNIVERSAL_MATRIX_CORS_ORIGINS: "${UNIVERSAL_MATRIX_CORS_ORIGINS:-}"
      UNIVERSAL_MATRIX_AUDIT_LEDGER: "/app/logs/audit_ledger.json"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: matrix_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      matrix-engine:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:13.2.2
    container_name: matrix_grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-}"
    depends_on:
      - prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.30.5-alpine
    container_name: matrix_nginx
    profiles: ["reverse-proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      matrix-engine:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  matrix_data:
  matrix_logs:
  prometheus_data:
  grafana_data:
