name: Universal Matrix Verification

on:
  push:
    branches: [canonical-kernel-v0.3]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"
          enable-cache: true

      - name: Install core verification environment
        run: uv sync --group test --group lint --extra scientific

      - name: Compile
        run: uv run python -m compileall -q src tests

      - name: Critical Ruff checks
        run: |
          uv run ruff check --select E9,F63,F7,F82 src tests

      - name: Canonical and open-engine tests
        run: |
          uv run pytest -q             tests/test_canonical_kernel.py             tests/test_math_reconciliation.py             tests/test_compiler.py             tests/test_lattice_quantum_engine.py             tests/test_nested_polarity_dynamics.py             tests/test_polarity_oscillator.py             tests/test_scale_transfer.py             tests/test_phase_roles.py             tests/test_nested_oscillatory_hierarchy.py             tests/test_canonical_polarity_clock.py             tests/test_content_clock.py             tests/test_content_ray_propagation.py             tests/test_content_massive_motion_candidates.py             tests/test_content_potential_field.py             tests/test_content_wave_dynamics.py             tests/test_causal_cone_bridge.py             tests/test_weak_field_ppn_bridge.py             tests/test_six_gate_spatial_response.py             tests/test_clock_space_reciprocity.py             tests/test_exponential_metric_strong_field.py             tests/test_effective_newton_coupling.py             tests/test_reciprocity_backreaction_audit.py             tests/test_localized_matter_variational.py             tests/test_matter_content_source_bridge.py             tests/test_radial_matter_solver.py             tests/test_matter_branch_scan.py             tests/test_classical_matter_dynamics.py             tests/test_localized_matter_persistence.py             tests/test_coupled_matter_content_dynamics.py             tests/test_fully_coupled_classical_fields.py             tests/test_fully_coupled_compact_fields.py             tests/test_su2_lattice_gauge.py             tests/test_su2_matter_doublet.py             tests/test_su3_lattice_gauge.py             tests/test_su3_matter_triplet.py             tests/test_electroweak_mass_bridge.py             tests/test_wilson_dirac_reference.py             tests/test_u1_wilson_dirac_lattice.py             tests/test_self_consistent_reciprocity_action.py             tests/test_reciprocity_newton_normalization.py             tests/test_reciprocity_metric_uniqueness.py             tests/test_scalar_virial_source_universality.py             tests/test_unified_variational_action.py             tests/test_theory_bridge.py             tests/test_gauge_dynamics.py             tests/test_gauge_hamiltonian.py             tests/test_gauge_dispersion.py             tests/test_gauge_3d.py             tests/test_gauge_matter.py             tests/test_source_interaction.py             tests/test_polarity_sources.py             tests/test_source_channels.py             tests/test_open_boundary_solver.py             tests/test_open_solver_manufactured.py             tests/test_open_gauge_dynamics.py             tests/test_open_polarity_sources.py             tests/test_unified_engine.py             tests/test_property_invariants.py

  full-suite:
    name: Full legacy compatibility suite
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"
          enable-cache: true

      - name: Install all optional runtime groups
        run: uv sync --group test --all-extras

      - name: Full pytest suite
        run: uv run pytest -q
