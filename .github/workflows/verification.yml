name: Universal Matrix Verification

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-and-extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification dependencies
        run: python -m pip install --upgrade pip pytest numpy

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Run canonical and reconstructed engine tests
        run: |
          python -m pytest -q             tests/test_canonical_kernel.py             tests/test_math_reconciliation.py             tests/test_compiler.py             tests/test_lattice_quantum_engine.py             tests/test_nested_polarity_dynamics.py             tests/test_theory_bridge.py             tests/test_gauge_dynamics.py             tests/test_gauge_hamiltonian.py             tests/test_gauge_dispersion.py             tests/test_gauge_3d.py             tests/test_gauge_matter.py             tests/test_source_interaction.py             tests/test_polarity_sources.py             tests/test_source_channels.py             tests/test_open_boundary_solver.py             tests/test_unified_engine.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run full test suite
        run: python -m pytest -q
