name: Universal Matrix Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"
          enable-cache: true

      - name: Install core verification environment
        run: uv sync --python "${{ matrix.python }}" --group test --group lint --extra scientific

      - name: Compile
        run: uv run python -m compileall -q src tests

      - name: Critical Ruff checks
        run: |
          uv run ruff check --select E9,F63,F7,F82 src tests

      - name: Canonical and open-engine tests
        run: |
          uv run pytest -q             tests/test_canonical_kernel.py             tests/test_math_reconciliation.py             tests/test_compiler.py             tests/test_lattice_quantum_engine.py             tests/test_nested_polarity_dynamics.py             tests/test_polarity_oscillator.py             tests/test_scale_transfer.py             tests/test_canonical_scale_transfer.py             tests/test_recursive_omniverse_contract.py             tests/test_sevenfold_seed_contract.py             tests/test_universe_port_engine.py             tests/test_vesica_tree_circulation.py             tests/test_transitive_plane_branching.py             tests/test_sri_yantra_multidimensional.py             tests/test_phase_roles.py             tests/test_nested_oscillatory_hierarchy.py             tests/test_canonical_polarity_clock.py             tests/test_content_clock.py             tests/test_content_ray_propagation.py             tests/test_content_massive_motion_candidates.py             tests/test_content_potential_field.py             tests/test_content_wave_dynamics.py             tests/test_causal_cone_bridge.py             tests/test_weak_field_ppn_bridge.py             tests/test_six_gate_spatial_response.py             tests/test_clock_space_reciprocity.py             tests/test_exponential_metric_strong_field.py             tests/test_effective_newton_coupling.py             tests/test_reciprocity_backreaction_audit.py             tests/test_localized_matter_variational.py             tests/test_matter_content_source_bridge.py             tests/test_radial_matter_solver.py             tests/test_matter_branch_scan.py             tests/test_classical_matter_dynamics.py             tests/test_localized_matter_persistence.py             tests/test_coupled_matter_content_dynamics.py             tests/test_fully_coupled_classical_fields.py             tests/test_fully_coupled_compact_fields.py             tests/test_su2_lattice_gauge.py             tests/test_su2_matter_doublet.py             tests/test_su2_hamiltonian_reference.py             tests/test_su2_hamiltonian.py             tests/test_su2_matter_gauge_dynamics.py             tests/test_su3_lattice_gauge.py             tests/test_su3_matter_triplet.py             tests/test_su3_hamiltonian.py             tests/test_su3_matter_gauge_dynamics.py             tests/test_electroweak_mass_bridge.py             tests/test_wilson_dirac_reference.py             tests/test_u1_wilson_dirac_lattice.py             tests/test_overlap_dirac_reference.py             tests/test_u1_overlap_dirac_lattice.py             tests/test_ginsparg_wilson_chirality.py             tests/test_weyl_measure_curvature.py             tests/test_weyl_measure_holonomy.py             tests/test_weyl_measure_stokes.py             tests/test_weyl_determinant.py             tests/test_u1_chiral_anomaly_ledger.py             tests/test_u1_weyl_gauge_orbit.py             tests/test_nonabelian_overlap_dirac_lattice.py             tests/test_product_group_anomaly_ledger.py             tests/test_product_group_overlap_dirac.py             tests/test_reciprocity_dirac_constant_background.py             tests/test_reciprocity_dirac_static_background.py             tests/test_reciprocity_dirac_time_background.py             tests/test_reciprocity_dirac_spacetime_background.py             tests/test_reciprocity_dirac_geometry_source.py             tests/test_reciprocity_dirac_backreaction.py             tests/test_self_consistent_reciprocity_action.py             tests/test_reciprocity_newton_normalization.py             tests/test_reciprocity_metric_uniqueness.py             tests/test_scalar_virial_source_universality.py             tests/test_static_vacuum_reciprocity_exterior.py             tests/test_stationary_source_universality.py             tests/test_reciprocity_u1_geometry_action.py             tests/test_reciprocity_yang_mills_geometry.py             tests/test_reciprocity_nonabelian_constant_geometry.py             tests/test_reciprocity_nonabelian_spatial_geometry.py             tests/test_reciprocity_dynamic_su2_geometry.py             tests/test_reciprocity_dynamic_su2_geometry_optimized.py             tests/test_reciprocity_dynamic_su3_geometry.py             tests/test_reciprocity_su3_matter_geometry.py             tests/test_reciprocity_unified_geometry_source.py             tests/test_reciprocity_exterior_curvature.py             tests/test_reciprocity_higher_order_weak_field.py             tests/test_reciprocity_second_order_light_deflection.py             tests/test_reciprocity_circular_orbits.py             tests/test_unified_variational_action.py             tests/test_theory_bridge.py             tests/test_gauge_dynamics.py             tests/test_gauge_hamiltonian.py             tests/test_gauge_dispersion.py             tests/test_gauge_3d.py             tests/test_gauge_matter.py             tests/test_source_interaction.py             tests/test_polarity_sources.py             tests/test_source_channels.py             tests/test_open_boundary_solver.py             tests/test_open_solver_manufactured.py             tests/test_open_gauge_dynamics.py             tests/test_open_polarity_sources.py             tests/test_unified_engine.py             tests/test_spatial_operations_control.py             tests/test_spatial_protocol.py             tests/test_digital_twin_contract.py             tests/test_robotics_xr_product.py             tests/test_commercial_entitlements.py             tests/test_licensing_governance.py             tests/test_documentation_governance.py             tests/test_matrix_ontology.py             tests/test_matrix_local_transition.py             tests/test_matrix_polarity_phase_bridge.py             tests/test_matrix_polarity_rotor_transition.py             tests/test_matrix_polarity_rotor_dispersion.py             tests/test_matter_amplitude_modes.py             tests/test_matter_defect_structure.py             tests/test_qball_existence_window.py             tests/test_radial_matter_continuation.py             tests/test_charged_matter_persistence.py             tests/test_qball_branch_diagnostics.py             tests/test_qball_stability_map.py             tests/test_qball_threshold_refinement.py             tests/test_qball_threshold_persistence_scan.py             tests/test_qball_mapping_convergence.py             tests/test_qball_mapping_error_decomposition.py             tests/test_qball_joint_mapping_extrapolation.py             tests/test_qball_threshold_preserving_grid.py             tests/test_qball_highres_persistence_stage1.py             tests/test_qball_highres_persistence_stage2.py             tests/test_qball_highres_persistence_stage3.py             tests/test_qball_highres_time_scaling.py             tests/test_qball_highres_persistence_stage4.py             tests/test_qball_highres_timeseries.py             tests/test_qball_highres_timeseries_t1.py             tests/test_qball_highres_timeseries_t1p5.py             tests/test_qball_highres_timeseries_t2.py             tests/test_qball_highres_timeseries_t2p5.py             tests/test_property_invariants.py

      - name: Refined threshold persistence report
        if: matrix.python == '3.12'
        run: uv run python -m src.qball_threshold_persistence_scan

      - name: Q-ball mapping convergence audit
        if: matrix.python == '3.12'
        run: uv run python -m src.qball_mapping_convergence

      - name: Q-ball mapping error decomposition
        if: matrix.python == '3.12'
        run: uv run python -m src.qball_mapping_error_decomposition

      - name: Q-ball joint mapping extrapolation
        if: matrix.python == '3.12'
        run: uv run python -m src.qball_joint_mapping_extrapolation

      - name: Q-ball threshold-preserving grid confirmation
        if: matrix.python == '3.12'
        run: uv run python -m src.qball_threshold_preserving_grid

      - name: Q-ball high-resolution persistence stage 1
        if: matrix.python == '3.12'
        run: uv run python -m src.qball_highres_persistence_stage1

      - name: Q-ball high-resolution persistence stage 2
        if: matrix.python == '3.12'
        run: uv run python -m src.qball_highres_persistence_stage2

      - name: Q-ball high-resolution persistence stage 3
        if: matrix.python == '3.12'
        run: uv run python -m src.qball_highres_persistence_stage3

      - name: Q-ball high-resolution time-scaling diagnostic
        if: matrix.python == '3.12'
        run: uv run python -m src.qball_highres_time_scaling

      - name: Q-ball high-resolution persistence stage 4
        if: matrix.python == '3.12'
        run: uv run python -m src.qball_highres_persistence_stage4

  full-suite:
    name: Full legacy compatibility suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"
          enable-cache: true

      - name: Install all optional runtime groups
        run: uv sync --python 3.12 --group test --all-extras

      - name: Full pytest suite
        run: uv run pytest -q

  qball-long-timeseries:
    name: Q-ball long time series / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"
          enable-cache: true

      - name: Install focused numerical environment
        run: uv sync --python 3.12 --group test --extra scientific

      - name: Focused long-timeseries diagnostic tests
        run: uv run pytest -q tests/test_qball_highres_timeseries_t1p5.py tests/test_qball_highres_timeseries_t2.py tests/test_qball_highres_timeseries_t2p5.py tests/test_qball_peak_period_classification.py

      - name: Q-ball high-resolution in-run time series t2p5
        run: uv run python -m src.qball_highres_timeseries_t2p5
