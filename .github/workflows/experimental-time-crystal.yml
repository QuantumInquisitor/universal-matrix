name: Experimental time-crystal checkpoint
on:
  pull_request:
    branches: [main, codex/recovery-plan-log]
    paths:
      - 'src/time_crystal_clock_subsystem.py'
      - 'tests/test_time_crystal_clock_subsystem.py'
      - 'scripts/report_time_crystal_subsystem.py'
      - 'docs/time_crystal_clock_subsystem_v0.1.md'
      - 'docs/crystal-research-fit.md'
      - '.github/workflows/experimental-time-crystal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: latest-known
      - name: Install verification environment
        run: uv sync --python 3.12 --group test --group lint --extra scientific --extra visualization
      - name: Check reference code
        run: |
          .venv/bin/ruff check src/time_crystal_clock_subsystem.py tests/test_time_crystal_clock_subsystem.py scripts/report_time_crystal_subsystem.py
          .venv/bin/ruff format --check src/time_crystal_clock_subsystem.py tests/test_time_crystal_clock_subsystem.py scripts/report_time_crystal_subsystem.py
          .venv/bin/python -m pytest -q tests/test_time_crystal_clock_subsystem.py tests/test_canonical_polarity_clock.py
      - name: Reproduce experiment reports
        env:
          MPLBACKEND: Agg
        run: |
          .venv/bin/python scripts/report_time_crystal_subsystem.py --output artifacts/time-crystal
      - name: Check bounded experiment acceptance
        run: .venv/bin/python -c "import json; from pathlib import Path; r=json.loads(Path('artifacts/time-crystal/time-crystal-subsystem.json').read_text()); assert len(r['cases'])==168; rows=[s for s in r['summary'] if s['g']==.97 and s['interactions']]; assert len(rows)==5 and all(s['finite_shot_perfect_fraction']==1 for s in rows); assert r['baselines'][-1]['receiver']['perfect_tick_delivery']"
