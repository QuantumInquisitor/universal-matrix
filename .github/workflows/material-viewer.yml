name: Computed material viewer
on:
  pull_request:
    paths:
      - 'docs/docs/material-viewer*'
      - 'docs/docs/visualizer.html'
      - 'tests/test_material_viewer.mjs'
      - 'scripts/export_material_viewer_example.py'
      - 'scripts/export_fold_material_viewer_frames.py'
      - 'tests/test_fold_material_viewer_frames.py'
      - 'docs/experiments/material-viewer-source.json'
      - '.github/workflows/material-viewer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --python 3.12 --extra scientific --group test --group lint
      - run: .venv/bin/python -m pytest -q tests/test_fold_material_viewer_frames.py
      - run: node --test --test-concurrency=1 tests/test_material_viewer.mjs
