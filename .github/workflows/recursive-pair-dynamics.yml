name: Recursive pair dynamics

on:
  pull_request:
    paths:
      - 'scripts/report_fold_recursive_pair_dynamics.py'
      - 'tests/test_fold_recursive_pair_dynamics.py'
      - 'docs/fold_recursive_pair_dynamics.md'
      - '.github/workflows/recursive-pair-dynamics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recursive-pair-dynamics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --python 3.12 --extra scientific --group test --group lint
      - name: Verify recursive pair dynamic self-similarity
        run: |
          uv run --python 3.12 --extra scientific ruff check scripts/report_fold_recursive_pair_dynamics.py tests/test_fold_recursive_pair_dynamics.py
          uv run --python 3.12 --extra scientific ruff format --check scripts/report_fold_recursive_pair_dynamics.py tests/test_fold_recursive_pair_dynamics.py
          uv run --python 3.12 --extra scientific python -m pytest tests/test_fold_recursive_pair_dynamics.py
          uv run --python 3.12 --extra scientific python scripts/report_fold_recursive_pair_dynamics.py --output artifacts/fold-recursive-pair/report.json
          uv run --python 3.12 --extra scientific python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          r = json.loads(Path('artifacts/fold-recursive-pair/report.json').read_text(encoding='utf-8'))
          json.dumps(r, allow_nan=False)
          for name, digest in r['sources'].items():
              assert digest == hashlib.sha256(Path('scripts', name).read_bytes()).hexdigest()
          for row in r['comparisons'].values():
              assert row['coordinate_max_difference'] < 1e-10
              assert row['scale_normalized_rate_max_difference'] < 1e-9
              assert row['normalized_mechanical_energy_max_difference'] < 1e-12
              assert row['normalized_loss_max_difference'] < 1e-12
              assert row['normalized_connector_potential_max_difference'] < 1e-12
              assert row['normalized_endpoint_work_max_difference'] < 1e-12
          for run in r['runs'].values():
              assert max(run['max_node_residual_j']) < 1e-10
              assert run['max_edge_residual_j'] < 1e-10
              assert run['max_total_residual_j'] < 1e-10
          for values_by_scale in r['child_uptake_fraction_by_reference_time'].values():
              fractions = list(values_by_scale.values())
              if fractions[0] is None:
                  assert all(value is None for value in fractions)
              else:
                  assert all(value is not None for value in fractions)
                  assert max(fractions) - min(fractions) < 1e-10
          assert not r['connector_coefficients_changed']
          assert not r['material_scaling_law_changed']
          assert not r['damping_law_changed']
          assert not r['embedded_tree_loading_reproduced']
          print(json.dumps({
              'comparisons': r['comparisons'],
              'child_uptake_fraction_by_reference_time': r['child_uptake_fraction_by_reference_time'],
              'reference_final_snapshot': r['runs']['1.0']['snapshots'][-1],
          }, sort_keys=True))
          PY
