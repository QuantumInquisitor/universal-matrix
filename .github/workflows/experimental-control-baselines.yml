          assert o['controls']['panel_stretch_comparisons'] == 54
          assert o['controls']['maximum_principal_stretch_error'] < 2e-14
          assert o['controls']['maximum_affine_fit_residual_m'] < 1e-14
          assert o['controls']['maximum_energy_ownership_error_j'] < 1e-15
          assert o['controls']['mismatched_theta_zero_reference_maximum_discrepancy'] > 0.1
          assert o['reference']['source_fixture_phase'] == 0.25
          assert o['reference']['divided_out_source_scale'] == 1.1
          for frame in o['frames']:
              assert len(set(b['id'] for b in frame['bodies'])) == 22
