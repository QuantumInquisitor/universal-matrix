          json.dumps(r, allow_nan=False)
          for name, digest in r['sources'].items():
              assert digest == hashlib.sha256(Path('scripts', name).read_text(encoding='utf-8').encode()).hexdigest()
          assert r['potential'] == 'constitutive'
          assert set(r['cases']) == {'equilibrium', 'conservative', 'passive', 'driven', 'drive_off'}
          for c in r['cases'].values():
              assert c['duration_s'] == 0.4 and c['potential'] == 'constitutive'
              assert c['maximum_balance_residual_j'] < 1e-10
          assert r['cases']['passive']['final_energy_j'] < r['cases']['passive']['initial_energy_j']
          assert r['cases']['driven']['final_state'][4] != 0
          off = [s for s in r['cases']['drive_off']['trace'] if s['time_s'] >= 0.2]
          assert len({s['work_j'] for s in off}) == 1
          assert r['energy_identity']['absolute_error_j_s'] < 1e-10
          assert r['energy_identity']['omitted_bias_absolute_error_j_s'] > 1e-8
          assert not r['physical_calibration'] and not r['stable_breathing_established']
          PY

