          assert c['reference_tangent']['skew_error'] < 1e-10
          assert min(c['reference_tangent']['numerical_eigenvalues']) > 0
          controls = c['coefficient_controls']
          assert controls['zero_law']['result']['total_energy_j'] == 0
          assert controls['axial_only']['result']['gradient'][1] == 0
          assert set(w['cases']) == {'one', 'three', 'five', 'fine_five', 'drive_off'}
          for name, case in w['cases'].items():
              assert case['completed'] and len(case['times']) == 201
