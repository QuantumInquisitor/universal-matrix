          assert comparison['kind'] == 'numerical_refinement'
          for result in comparison['per_mode'].values():
              assert result['max_abs_q'] < 1e-8 and result['max_abs_rate'] < 1e-8
          assert not w['pattern_selection_established'] and not w['traveling_wave'] and not w['quantum_model']
