          assert c['fixture']['sha256_normalized_text'] == hashlib.sha256(Path(c['fixture']['path']).read_text().encode()).hexdigest()
          assert c['fixture']['reference_commit'] == '60a7fd60f57d73b89ea5397db58a3ff5d291556c'
