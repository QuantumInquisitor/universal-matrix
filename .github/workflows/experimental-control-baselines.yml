name: Experimental control baselines

on:
  pull_request:
    paths:
      - 'scripts/report_phase_pattern_controls.py'
      - 'scripts/report_chiral_phase_controls.py'
      - 'scripts/report_phase_delay_controls.py'
      - 'scripts/report_material_specimen.py'
      - 'scripts/report_material_restart.py'
      - 'scripts/report_fold_kinematics.py'
      - 'scripts/export_fold_reference_fixture.py'
      - 'scripts/report_fold_dynamics.py'
      - 'scripts/report_fold_modes.py'
      - 'scripts/report_fold_reservoir.py'
      - 'scripts/report_fold_coupling.py'
      - 'scripts/report_fold_network.py'
      - 'scripts/report_fold_hierarchy.py'
      - 'scripts/report_fold_mapped.py'
      - 'scripts/report_fold_scaling.py'
      - 'scripts/report_fold_scaled_pair.py'
      - 'scripts/export_lynchpin_material_scene.py'
      - 'tests/test_lynchpin_material_scene.py'
      - 'scripts/fold_material_multiscale.py'
      - 'scripts/report_fold_material_multiscale.py'
      - 'tests/test_fold_material_multiscale.py'
      - 'scripts/report_fold_material_supply.py'
      - 'tests/test_fold_material_supply.py'
      - 'scripts/export_fold_material_viewer_frames.py'
      - 'tests/test_fold_material_viewer_frames.py'
      - 'scripts/report_fold_material_coupling.py'
      - 'tests/test_fold_material_coupling.py'
      - 'scripts/report_fold_material_dynamics.py'
      - 'tests/test_fold_constitutive_dynamics.py'
      - 'scripts/report_fold_constitutive.py'
      - 'scripts/plot_fold_constitutive.py'
      - 'tests/test_fold_constitutive.py'
      - 'scripts/report_wave_harmonics.py'
      - 'tests/test_wave_harmonics.py'
      - 'docs/recovery/wave-source-provenance.json'
      - 'scripts/report_fold_threshold.py'
      - 'scripts/plot_fold_threshold.py'
      - 'tests/test_fold_threshold.py'
      - 'docs/experiments/fold-seed-compatibility.json'
      - 'tests/fixtures/fold_supply_seed/**'
      - 'scripts/report_fold_stability.py'
      - 'scripts/plot_fold_stability.py'
      - 'tests/test_fold_stability.py'
      - 'docs/experiments/fold-supply-summary.json'
      - 'scripts/report_fold_supply.py'
      - 'scripts/plot_fold_supply.py'
      - 'tests/test_fold_supply.py'
      - 'scripts/report_fold_duration.py'
      - 'scripts/plot_fold_duration.py'
      - 'tests/test_fold_duration.py'
      - 'scripts/report_fold_active_multiscale.py'
      - 'scripts/plot_fold_active_multiscale.py'
      - 'tests/test_fold_active_multiscale.py'
      - 'scripts/report_fold_multiscale.py'
      - 'scripts/plot_fold_multiscale.py'
      - 'tests/test_fold_multiscale.py'
      - 'tests/test_fold_scaled_pair.py'
      - 'tests/test_fold_scaling.py'
      - 'tests/test_fold_mapped.py'
      - 'tests/test_fold_hierarchy.py'
      - 'tests/test_fold_network.py'
      - 'tests/test_fold_coupling.py'
      - 'tests/test_fold_reservoir.py'
      - 'scripts/report_fold_robustness.py'
      - 'tests/test_fold_modes.py'
      - 'tests/test_fold_robustness.py'
      - 'scripts/plot_fold_dynamics.py'
      - 'tests/test_phase_pattern_controls.py'
      - 'tests/test_chiral_phase_controls.py'
      - 'tests/test_phase_delay_controls.py'
      - 'tests/test_material_specimen.py'
      - 'tests/test_material_restart.py'
      - 'tests/test_fold_kinematics.py'
      - 'tests/test_fold_source_fixture.py'
      - 'tests/test_fold_dynamics.py'
      - 'docs/experiments/fold-original-source-fixture.json'
      - '.github/workflows/experimental-control-baselines.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --group test --group lint
      - name: Check bounded experiment implementations
        run: |
          uv run ruff check scripts/report_phase_pattern_controls.py scripts/report_chiral_phase_controls.py scripts/report_phase_delay_controls.py scripts/report_material_specimen.py tests/test_phase_pattern_controls.py tests/test_chiral_phase_controls.py tests/test_phase_delay_controls.py tests/test_material_specimen.py
          uv run ruff format --check scripts/report_phase_pattern_controls.py scripts/report_chiral_phase_controls.py scripts/report_phase_delay_controls.py scripts/report_material_specimen.py tests/test_phase_pattern_controls.py tests/test_chiral_phase_controls.py tests/test_phase_delay_controls.py tests/test_material_specimen.py
          uv run python -m pytest tests/test_phase_pattern_controls.py tests/test_chiral_phase_controls.py tests/test_phase_delay_controls.py tests/test_material_specimen.py
      - name: Reproduce baseline reports
        run: |
          uv run python scripts/report_phase_pattern_controls.py --output artifacts/control-baselines/phase-pattern.json
          uv run python scripts/report_chiral_phase_controls.py --output artifacts/control-baselines/chiral.json
          uv run python scripts/report_phase_delay_controls.py --output artifacts/control-baselines/delay.json
          uv run python scripts/report_material_specimen.py --output artifacts/control-baselines/material.json
      - name: Verify reported controls and provenance
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          reports = {}
          for name, script in [('phase-pattern', 'phase_pattern_controls'), ('chiral', 'chiral_phase_controls'), ('delay', 'phase_delay_controls'), ('material', 'material_specimen')]:
              report = json.loads(Path(f'artifacts/control-baselines/{name}.json').read_text())
              expected = hashlib.sha256(Path(f'scripts/report_{script}.py').read_text().encode()).hexdigest()
              assert report['source_sha256'] == expected
              reports[name] = report
          phase = reports['phase-pattern']
          assert phase['case_count'] == len(phase['cases']) == 108
          assert max(abs(r['balance_residual']) for r in phase['cases']) < 2e-6
          chiral = reports['chiral']
          assert chiral['case_count'] == len(chiral['cases']) == 36
          assert max(abs(r['balance_residual']) for r in chiral['cases']) < 1e-7
          delay = reports['delay']
          assert delay['case_count'] == len(delay['cases']) == 54
          for r in delay['cases']:
              assert r['maximum_prearrival_paired_difference'] == 0
              if r['parameters']['coupling'] == 0:
                  assert r['first_detected_paired_difference'] is None
              else:
                  assert r['first_detected_paired_difference'] > r['earliest_allowed_arrival']
          material = reports['material']['cases']
          assert len(material) == 4 and sum(map(len, material.values())) == 12
          assert abs(material['driven_damped'][-1]['balance_residual_j']) < 1e-8
          PY
      - name: Check switched mechanical restart and energy ownership
        run: |
          uv run ruff check scripts/report_material_restart.py tests/test_material_restart.py
          uv run ruff format --check scripts/report_material_restart.py tests/test_material_restart.py
          uv run python -m pytest tests/test_material_restart.py tests/test_material_specimen.py
          uv run python scripts/report_material_restart.py --output artifacts/control-baselines/material-restart.json
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/control-baselines/material-restart.json').read_text())
          assert len(r['cases']) == 3
          assert set(r['sources']) == {'report_material_restart.py', 'report_material_specimen.py'}
          for name, value in r['sources'].items():
              assert value == hashlib.sha256(Path('scripts', name).read_text().encode()).hexdigest()
          for case in r['cases']:
              assert case['exact_replay']
              assert case['off_interval_work_j'] == 0
              assert sum(case['final']['owned_energy_j']) < sum(case['cutoff']['owned_energy_j'])
          fine = r['cases'][-1]['final']
          assert abs(fine['total_balance_residual_j']) < 1e-8
          assert max(map(abs, fine['ownership_residuals_j'])) < 1e-8
          PY
      - name: Check recovered folding kinematics and inertia
        run: |
          uv run ruff check scripts/report_fold_kinematics.py scripts/export_fold_reference_fixture.py tests/test_fold_kinematics.py tests/test_fold_source_fixture.py
          uv run ruff format --check scripts/report_fold_kinematics.py scripts/export_fold_reference_fixture.py tests/test_fold_kinematics.py tests/test_fold_source_fixture.py
          uv run python -m pytest tests/test_fold_kinematics.py tests/test_fold_source_fixture.py
          uv run python scripts/report_fold_kinematics.py --output artifacts/fold-kinematics/report.json
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/fold-kinematics/report.json').read_text())
          assert r['adapter_sha256'] == hashlib.sha256(Path('scripts/report_fold_kinematics.py').read_text().encode()).hexdigest()
          replay = r['independent_original_source_replay']
          assert replay['fixture_sha256_normalized_text'] == hashlib.sha256(Path(replay['fixture_path']).read_text().encode()).hexdigest()
          assert len(r['body_ids']) == len(set(r['body_ids'])) == 22
          assert len(r['samples']) == 17 and replay['cases'] == 9
          assert replay['maximum_position_absolute_error_m'] < 1e-14
          assert all(s['minimum_eigenvalue'] > 0 for s in r['samples'])
          assert max(s['kinetic_identity_absolute_error_j'] for s in r['samples']) < 1e-18
          assert not r['physical_material_validation'] and not r['dynamics_implemented']
          PY
      - name: Check force-driven fold energy and negative control
        run: |
          uv run ruff check scripts/report_fold_dynamics.py scripts/plot_fold_dynamics.py tests/test_fold_dynamics.py
          uv run ruff format --check scripts/report_fold_dynamics.py scripts/plot_fold_dynamics.py tests/test_fold_dynamics.py
          uv run python -m pytest tests/test_fold_dynamics.py
          uv run python scripts/report_fold_dynamics.py --output artifacts/fold-dynamics/report.json
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/fold-dynamics/report.json').read_text())
          assert set(r['source_sha256_normalized_text']) == {'report_fold_dynamics.py', 'report_fold_kinematics.py'}
          for name, value in r['source_sha256_normalized_text'].items():
              assert value == hashlib.sha256(Path('scripts', name).read_text().encode()).hexdigest()
          cases = r['cases']
          assert set(cases) == {'equilibrium', 'conservative', 'damped', 'driven', 'drive_off', 'omitted_bias_control'}
          assert len(r['refinements']) == 6 and len(r['body_ids']) == 22
          for name, case in cases.items():
              if name != 'omitted_bias_control':
                  assert case['maximum_balance_residual_j'] < 1e-13
          assert cases['omitted_bias_control']['maximum_balance_residual_j'] > 1e-10
          assert r['energy_identity']['absolute_error_j_s'] < 1e-11
          assert r['energy_identity']['omitted_bias_absolute_error_j_s'] > 1e-8
          assert cases['damped']['final_energy_j'] < cases['damped']['initial_energy_j']
          after = [s['work_j'] for s in cases['drive_off']['trace'] if s['time_s'] >= 1]
          assert after and max(after) == min(after)
          assert not r['physical_calibration'] and not r['autonomous_breathing']
          PY
      - name: Check fold modes and finite sensitivity
        run: |
          uv run ruff check scripts/report_fold_modes.py scripts/report_fold_robustness.py tests/test_fold_modes.py tests/test_fold_robustness.py
          uv run ruff format --check scripts/report_fold_modes.py scripts/report_fold_robustness.py tests/test_fold_modes.py tests/test_fold_robustness.py
          uv run python -m pytest tests/test_fold_modes.py tests/test_fold_robustness.py
          uv run python scripts/report_fold_modes.py --output artifacts/fold-modes/report.json
          uv run python scripts/report_fold_robustness.py --output artifacts/fold-robustness/report.json
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          m = json.loads(Path('artifacts/fold-modes/report.json').read_text())
          r = json.loads(Path('artifacts/fold-robustness/report.json').read_text())
          for hashes in (m['sources'], r['source_sha256_normalized_text']):
              assert len(hashes) == 3
              for name, value in hashes.items():
                  assert value == hashlib.sha256(Path('scripts', name).read_text().encode()).hexdigest()
          assert len(m['cases']) == 6
          assert all(c['maximum_balance_residual_j'] < 1e-12 for c in m['cases'])
          assert max(m['step_refinement']['final_coordinate_absolute_differences']) < 1e-8
          for mode in (0, 1):
              cases = [c for c in m['cases'] if c['mode'] == mode]
              for field in ('max_scale_error', 'max_angle_error_rad'):
                  assert all(3 < a[field] / b[field] < 5 for a, b in zip(cases, cases[1:]))
          assert len(r['cases']) == 24
          assert r['counts'] == {'success': 21, 'domain-rejected': 3, 'numerical-error': 0}
          assert r['rejected_refinement'] == ['domain-rejected'] * 3
          for c in r['cases']:
              if c['classification'] == 'success':
                  assert c['metrics']['max_balance_residual_j'] < 1e-10
          refinement = r['accepted_refinement']
          assert max(refinement['final_coordinate_absolute_difference']) < 1e-7
          assert refinement['residual_j_coarse_fine'][1] < refinement['residual_j_coarse_fine'][0]
          PY
      - name: Check finite fold reservoir
        run: |
          uv run ruff check scripts/report_fold_reservoir.py tests/test_fold_reservoir.py
          uv run ruff format --check scripts/report_fold_reservoir.py tests/test_fold_reservoir.py
          uv run python -m pytest tests/test_fold_reservoir.py
          uv run python scripts/report_fold_reservoir.py --output artifacts/fold-reservoir/report.json
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/fold-reservoir/report.json').read_text())
          assert len(r['sources']) == 3 and len(r['cases']) == 6
          for name, value in r['sources'].items():
              assert value == hashlib.sha256(Path('scripts', name).read_text().encode()).hexdigest()
          for name, c in r['cases'].items():
              assert c['minimum_reserve_j'] >= 0
              if name != 'omitted_debit_control':
                  assert c['max_total_residual_j'] < 1e-11
                  assert c['final_state'][5] <= c['settings']['efficiency'] * c['settings']['initial_reserve_j'] + 1e-15
          assert r['cases']['omitted_debit_control']['max_total_residual_j'] > 1e-6
          assert r['cases']['fueled']['final_state'][4] < 1e-5 / 3
          assert r['refinement']['residuals_j'][1] < r['refinement']['residuals_j'][0]
          assert max(r['refinement']['final_coordinate_absolute_differences']) < 1e-7
          assert not r['claims']['sustained_autonomous_breathing']
          PY
      - name: Check two-module fold exchange
        run: |
          uv run ruff check scripts/report_fold_coupling.py tests/test_fold_coupling.py
          uv run ruff format --check scripts/report_fold_coupling.py tests/test_fold_coupling.py
          uv run python -m pytest tests/test_fold_coupling.py
          uv run python scripts/report_fold_coupling.py --output artifacts/fold-coupling/report.json
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/fold-coupling/report.json').read_text())
          assert len(r['sources']) == 4 and len(r['cases']) == 4
          for name, value in r['sources'].items():
              assert value == hashlib.sha256(Path('scripts', name).read_text().encode()).hexdigest()
          for name, c in r['cases'].items():
              assert len(c['initial_state']) == 20
              assert c['max_module_residual_j'] < 1e-11
              if name != 'wrong_reaction_control':
                  assert c['max_total_residual_j'] < 1e-11
                  assert c['max_connection_residual_j'] < 1e-11
          assert r['cases']['wrong_reaction_control']['max_total_residual_j'] > 1e-6
          assert r['cases']['wrong_reaction_control']['max_connection_residual_j'] > 1e-6
          assert r['cases']['disconnected']['samples'][-1]['mechanical_j'][1] == 0
          assert r['cases']['conservative']['samples'][-1]['mechanical_j'][1] > 1e-6
          assert r['refinement']['residuals_j'][1] < r['refinement']['residuals_j'][0]
          assert max(max(row) for row in r['refinement']['final_coordinate_absolute_differences']) < 1e-7
          assert not r['full_structure_recursive_validation'] and not r['sustained_breathing']
          PY
      - name: Check fold network energy ownership
        run: |
          uv run ruff check scripts/report_fold_network.py tests/test_fold_network.py
          uv run ruff format --check scripts/report_fold_network.py tests/test_fold_network.py
          uv run python -m pytest tests/test_fold_network.py
          uv run python scripts/report_fold_network.py --output artifacts/fold-network/report.json
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/fold-network/report.json').read_text())
          assert len(r['sources']) == 5 and len(r['cases']) == 6
          for name, value in r['sources'].items():
              assert value == hashlib.sha256(Path('scripts', name).read_text().encode()).hexdigest()
          for name, c in r['cases'].items():
              assert c['nodes'] == 4 and len(c['initial_state']) == 36 + 2 * len(c['edges'])
              assert c['max_node_residual_j'] < 1e-10
              if name != 'broken_chain':
                  assert c['max_total_residual_j'] < 1e-10
                  assert max(c['max_edge_residuals_j'], default=0) < 1e-10
          bad = r['cases']['broken_chain']
          assert bad['max_total_residual_j'] > 1e-9
          assert bad['max_edge_residuals_j'][1] > 1e-9
          assert max(bad['max_edge_residuals_j'][::2]) < 1e-10
          assert r['cases']['disconnected']['samples'][-1]['mechanical_j'][1:] == [0, 0, 0]
          assert all(e > 0 for e in r['cases']['conservative_chain']['samples'][-1]['mechanical_j'][1:])
          assert r['refinement']['residuals_j'][1] < r['refinement']['residuals_j'][0]
          assert max(max(row) for row in r['refinement']['per_node_coordinate_absolute_differences']) < 1e-7
          assert not r['full_recursive_structure_validated'] and not r['sustained_breathing']
          PY
      - name: Check hierarchical fold regrouping
        run: |
          uv run ruff check scripts/report_fold_hierarchy.py tests/test_fold_hierarchy.py
          uv run ruff format --check scripts/report_fold_hierarchy.py tests/test_fold_hierarchy.py
          uv run python -m pytest tests/test_fold_hierarchy.py
          uv run python scripts/report_fold_hierarchy.py --output artifacts/fold-hierarchy/report.json
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/fold-hierarchy/report.json').read_text())
          assert len(r['sources']) == 6 and len(r['cases']) == 4
          for name, value in r['sources'].items():
              assert value == hashlib.sha256(Path('scripts', name).read_text().encode()).hexdigest()
          for c in r['cases'].values():
              assert sorted(e for owned in c['owners'].values() for e in owned) == list(range(4))
              assert max(c['group_max_residual_j'].values()) < 1e-11
              assert max(max(row) for row in c['maximum_coordinate_differences_per_node']) < 1e-12
              assert c['maximum_energy_state_difference_j'] < 1e-15
              assert c['final_accounts']['root']['boundary_work_j'] == 0
          control = r['duplicate_edge_accounting_control']
          assert control['initial_total_overcount_j'] > 1e-7
          assert abs(control['spurious_energy_change_j']) > 1e-7
          assert not r['full_recursive_physical_validation'] and not r['sustained_breathing']
          PY
      - name: Check mapped fold connector
        run: |
          uv run ruff check scripts/report_fold_mapped.py tests/test_fold_mapped.py
          uv run ruff format --check scripts/report_fold_mapped.py tests/test_fold_mapped.py
          uv run python -m pytest tests/test_fold_mapped.py
          uv run python scripts/report_fold_mapped.py --output artifacts/fold-mapped/report.json
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/fold-mapped/report.json').read_text())
          assert len(r['sources']) == 5 and len(r['cases']) == 5
          for name, value in r['sources'].items():
              assert value == hashlib.sha256(Path('scripts', name).read_text().encode()).hexdigest()
          for name, c in r['cases'].items():
              assert c['max_node_residual_j'] < 1e-11
              if name != 'wrong_jacobian_control':
                  assert c['max_total_residual_j'] < 1e-11
                  assert c['max_connector_residual_j'] < 1e-11
          bad = r['cases']['wrong_jacobian_control']
          assert bad['max_total_residual_j'] > 1e-7 and bad['max_connector_residual_j'] > 1e-7
          assert r['cases']['conservative']['samples'][-1]['mechanical_j'][1] > 1e-8
          assert r['refinement']['residuals_j'][1] < r['refinement']['residuals_j'][0]
          assert max(max(row) for row in r['refinement']['coordinate_differences_by_module']) < 1e-7
          assert not r['geometric_mass_scaling_validated'] and not r['physical_recursive_assembly_validated']
          assert not r['sustained_breathing']
          PY
      - name: Check conditional fold body scaling
        run: |
          uv run ruff check scripts/report_fold_scaling.py tests/test_fold_scaling.py
          uv run ruff format --check scripts/report_fold_scaling.py tests/test_fold_scaling.py
          uv run python -m pytest tests/test_fold_scaling.py
          uv run python scripts/report_fold_scaling.py --output artifacts/fold-scaling/report.json
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/fold-scaling/report.json').read_text())
          assert len(r['sources']) == 3 and len(r['cases']) == 3
          for name, value in r['sources'].items():
              assert value == hashlib.sha256(Path('scripts', name).read_text().encode()).hexdigest()
          for c in r['cases']:
              assert c['max_balance_residual_j'] < 1e-12
              checks = c['scaling_checks']
              for key in ('mass_matrix_relative_error', 'bias_relative_error', 'point_inertia_relative_error'):
                  assert checks[key] < 1e-12
              assert checks['position_error_m'] < 1e-14
              similarity = c['similarity_checks']
              assert max(similarity['coordinate_max_differences']) < 1e-12
              assert max(similarity['reference_rate_max_differences']) < 1e-12
              assert similarity['energy_max_difference_j'] < 1e-15
          assert r['wrong_inertia_control']['max_balance_residual_j'] > 1e-8
          assert not r['calibrated_material'] and not r['scaled_connector_integrated']
          assert not r['recursive_assembly_validated']
          PY
      - name: Check scaled fold pair and stiffness comparison
        run: |
          uv run ruff check scripts/report_fold_scaled_pair.py tests/test_fold_scaled_pair.py
          uv run ruff format --check scripts/report_fold_scaled_pair.py tests/test_fold_scaled_pair.py
          uv run python -m pytest tests/test_fold_scaled_pair.py
          uv run python scripts/report_fold_scaled_pair.py --output artifacts/fold-scaled-pair/report.json
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/fold-scaled-pair/report.json').read_text())
          assert len(r['sources']) == 7 and len(r['cases']) == 4
          for name, value in r['sources'].items():
              assert value == hashlib.sha256(Path('scripts', name).read_text().encode()).hexdigest()
          for name, c in r['cases'].items():
              for key in ('max_total_residual_j', 'max_module_residual_j', 'max_connector_residual_j'):
                  assert c[key] < 1e-12
              if name != 'fixed_stiffness_comparison':
                  s = c['similarity']
                  assert max(map(max, s['coordinate_max_differences'])) < 1e-12
                  assert max(map(max, s['rescaled_rate_max_differences'])) < 1e-12
                  assert s['rescaled_energy_max_difference_j'] < 1e-15
          control = r['cases']['fixed_stiffness_comparison']['similarity']
          assert max(map(max, control['coordinate_max_differences'])) > 1e-4
