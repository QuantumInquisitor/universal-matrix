name: Recursive governing-state clearance

on:
  pull_request:
    paths:
      - 'scripts/report_fold_recursive_governing_clearance.py'
      - 'tests/test_fold_recursive_governing_clearance.py'
      - 'docs/fold_recursive_governing_clearance.md'
      - '.github/workflows/recursive-governing-clearance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recursive-governing-clearance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --python 3.12 --extra scientific --group test --group lint
      - name: Verify dense governing-state controls
        run: |
          uv run --python 3.12 --extra scientific ruff check scripts/report_fold_recursive_governing_clearance.py tests/test_fold_recursive_governing_clearance.py
          uv run --python 3.12 --extra scientific ruff format --check scripts/report_fold_recursive_governing_clearance.py tests/test_fold_recursive_governing_clearance.py
          uv run --python 3.12 --extra scientific python -m pytest tests/test_fold_recursive_governing_clearance.py
      - name: Run dense governing-state clearance once
        run: |
          uv run --python 3.12 --extra scientific python -m scripts.report_fold_recursive_governing_clearance --output artifacts/fold-recursive-clearance/governing.json
          uv run --python 3.12 --extra scientific python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          r = json.loads(Path('artifacts/fold-recursive-clearance/governing.json').read_text(encoding='utf-8'))
          json.dumps(r, allow_nan=False)
          assert r['resolved_bracket']
          for name, digest in r['sources'].items():
              assert digest == hashlib.sha256(Path('scripts', name).read_bytes()).hexdigest()
          assert r['dense_state_count_per_module'] == 30
          assert r['dense_independent_state_pair_count'] == 900
          assert not r['final_lower_row']['collision_free']
          assert r['final_upper_row']['collision_free']
          assert r['final_lower_colliding_ratio'] < r['final_upper_collision_free_ratio']
          assert r['broad_grid_control_at_final_upper']['collision_free']
          assert not r['body_geometry_changed']
          assert not r['collision_tolerance_changed']
          assert not r['physical_body_thickness_modeled']
          assert not r['continuous_clearance_theorem']
          assert not r['common_vessel_to_module_ratio_selected']
          print(json.dumps({
              'final_bracket': [
                  r['final_lower_colliding_ratio'],
                  r['final_upper_collision_free_ratio'],
              ],
              'final_width': r['final_width'],
              'corner_is_governing': r['corner_is_governing_at_final_upper'],
              'interior_margin_m': r['interior_clearance_margin_at_final_upper_m'],
              'lower_governing': r['final_lower_row']['governing_case'],
              'upper_governing': r['final_upper_row']['governing_case'],
              'upper_interior_governing': r['final_upper_row']['interior_governing_case'],
              'upper_min_clearance_m': r['final_upper_row']['minimum_clearance_m'],
              'broad_control_min_clearance_m': r['broad_grid_control_at_final_upper']['minimum_clearance_m'],
              'dense_ratio_scans': r['unique_dense_ratio_scan_count'],
          }, sort_keys=True))
          PY
