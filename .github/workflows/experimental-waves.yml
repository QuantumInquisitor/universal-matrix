name: Experimental waves checkpoint
on:
  pull_request:
    branches: [main, codex/recovery-plan-log]
    paths:
      - 'src/time_order_diagnostics.py'
      - 'src/proposed_nonlinear_wave_control.py'
      - 'src/proposed_mode_pair_control.py'
      - 'src/proposed_multimode_wave_control.py'
      - 'tests/test_time_order_diagnostics.py'
      - 'tests/test_proposed_nonlinear_wave_control.py'
      - 'tests/test_proposed_mode_pair_control.py'
      - 'tests/test_proposed_multimode_wave_control.py'
      - 'scripts/report_time_order_controls.py'
      - 'scripts/report_mode_pair_robustness.py'
      - 'scripts/report_multimode_wave_control.py'
      - 'docs/time_order_and_wave_controls_v0.1.md'
      - 'docs/mode_pair_robustness_v0.1.md'
      - 'docs/multimode_wave_control_v0.1.md'
      - '.github/workflows/experimental-waves.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: latest-known
      - name: Install verification environment
        run: uv sync --python 3.12 --group test --group lint --extra scientific --extra visualization
      - name: Check reference code
        run: |
          .venv/bin/ruff check src/time_order_diagnostics.py src/proposed_nonlinear_wave_control.py src/proposed_mode_pair_control.py src/proposed_multimode_wave_control.py tests/test_time_order_diagnostics.py tests/test_proposed_nonlinear_wave_control.py tests/test_proposed_mode_pair_control.py tests/test_proposed_multimode_wave_control.py scripts/report_time_order_controls.py scripts/report_mode_pair_robustness.py scripts/report_multimode_wave_control.py
          .venv/bin/ruff format --check src/time_order_diagnostics.py src/proposed_nonlinear_wave_control.py src/proposed_mode_pair_control.py src/proposed_multimode_wave_control.py tests/test_time_order_diagnostics.py tests/test_proposed_nonlinear_wave_control.py tests/test_proposed_mode_pair_control.py tests/test_proposed_multimode_wave_control.py scripts/report_time_order_controls.py scripts/report_mode_pair_robustness.py scripts/report_multimode_wave_control.py
          .venv/bin/python -m pytest -q tests/test_time_order_diagnostics.py tests/test_proposed_nonlinear_wave_control.py tests/test_proposed_mode_pair_control.py tests/test_proposed_multimode_wave_control.py tests/test_proposed_scalar_wave_control.py
      - name: Reproduce experiment reports
        env:
          MPLBACKEND: Agg
        run: |
          .venv/bin/python scripts/report_time_order_controls.py --output artifacts/waves
          .venv/bin/python scripts/report_mode_pair_robustness.py --output artifacts/waves/mode-pair-robustness.json
          .venv/bin/python scripts/report_multimode_wave_control.py --output artifacts/waves
      - name: Check bounded experiment acceptance
        run: .venv/bin/python -c "import json; from pathlib import Path; r=Path('artifacts/waves'); w=json.loads((r/'time-order-controls.json').read_text()); assert len(w['cases'])==14; assert w['cases']['nonlinear']['late_window']['two_cycle_error']<1e-5; assert w['cases']['linear']['late_window']['late_to_early_rms']>10; p=json.loads((r/'mode-pair-robustness.json').read_text()); assert p['ideal']['meets_declared_tracking_target'] and not p['stiffness_1.2']['meets_declared_tracking_target']; m=json.loads((r/'multimode-wave-control.json').read_text()); assert all(c['result']['max_energy_balance_residual']<1e-8 for c in m['cases'].values())"
