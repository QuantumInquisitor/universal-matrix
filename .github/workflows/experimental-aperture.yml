name: Experimental aperture and fanout

on:
  pull_request:
    paths:
      - 'src/toroidal_*.py'
      - 'tests/test_toroidal_*.py'
      - 'scripts/report_aperture_integration.py'
      - 'scripts/report_combined_aperture.py'
      - 'scripts/report_assembly_breathing.py'
      - 'docs/toroidal_assembly_breathing_v0.1.md'
      - 'docs/experiments/assembly-breathing-summary.json'
      - 'docs/toroidal_combined_aperture_v0.1.md'
      - 'docs/experiments/combined-aperture-summary.json'
      - 'docs/toroidal_aperture_integration_v0.1.md'
      - 'docs/experiments/aperture-summary.json'
      - '.github/workflows/experimental-aperture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aperture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --group test --group lint
      - name: Check optional source and tests
        run: |
          uv run ruff check src/toroidal_aperture_local.py src/toroidal_aperture_attachment.py src/toroidal_outer_attachment.py src/toroidal_retained_collision.py src/toroidal_aperture_fanout.py tests/test_toroidal_aperture_attachment.py tests/test_toroidal_outer_attachment.py tests/test_toroidal_aperture_fanout.py scripts/report_aperture_integration.py
          uv run ruff format --check src/toroidal_aperture_local.py src/toroidal_aperture_attachment.py src/toroidal_outer_attachment.py src/toroidal_retained_collision.py src/toroidal_aperture_fanout.py tests/test_toroidal_aperture_attachment.py tests/test_toroidal_outer_attachment.py tests/test_toroidal_aperture_fanout.py scripts/report_aperture_integration.py
      - name: Verify geometry fields and rejection controls
        run: uv run python -m pytest tests/test_toroidal_aperture_attachment.py tests/test_toroidal_outer_attachment.py tests/test_toroidal_aperture_fanout.py tests/test_toroidal_bore_downstream.py tests/test_toroidal_bore_downstream_adversarial.py
      - name: Reproduce all six signed cases
        run: uv run python scripts/report_aperture_integration.py --output-dir artifacts/aperture
      - name: Check combined inventory and rejection controls
        run: |
          uv run ruff check src/toroidal_combined_aperture.py tests/test_toroidal_combined_aperture.py scripts/report_combined_aperture.py
          uv run ruff format --check src/toroidal_combined_aperture.py tests/test_toroidal_combined_aperture.py scripts/report_combined_aperture.py
          uv run python -m pytest tests/test_toroidal_combined_aperture.py
          uv run python scripts/report_combined_aperture.py --output-dir artifacts/combined-aperture
      - name: Check report acceptance and scope
        # All three scopes remain separately inspectable.
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('artifacts/aperture/summary.json').read_text())['cases']
          assert len(rows) == 6
          assert {r['current'] for r in rows} == {1, -1, 2e-8, -2e-8, 7, -7}
          for r in rows:
              assert (r['inner_pairs'], r['aperture_pairs'], r['outer_pairs'], r['replacement_pairs']) == (117, 56, 508, 861)
              assert r['outer_pass'] and r['replacement_pass']
              assert r['replacement_interfaces'] == 13
              assert r['outer_cut_flux_relative_error'] < 1e-10
              assert not r['full_network_certified'] and not r['motion_certified']
          rows = json.loads(Path('artifacts/combined-aperture/summary.json').read_text())['cases']
          assert {r['current'] for r in rows} == {1, -1, 2e-8, -2e-8, 7, -7}
          assert len(rows) == 6
          for r in rows:
              assert (r['component_count'], r['pair_count'], r['port_count'], r['interface_count']) == (69, 2346, 8, 62)
              assert r['static_pair_clearance_complete']
              assert r['maximum_port_relative_residual'] < 1e-10
              assert not r['motion_certified'] and not r['material_dynamics_validated']
          PY
      - name: Check prescribed common assembly breathing
        run: |
          uv run ruff check src/toroidal_assembly_breathing.py tests/test_toroidal_assembly_breathing.py scripts/report_assembly_breathing.py
          uv run ruff format --check src/toroidal_assembly_breathing.py tests/test_toroidal_assembly_breathing.py scripts/report_assembly_breathing.py
          uv run python -m pytest tests/test_toroidal_assembly_breathing.py
          uv run python scripts/report_assembly_breathing.py --output-dir artifacts/assembly-breathing
          uv run python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('artifacts/assembly-breathing/summary.json').read_text())['cases']
          assert len(rows) == 6
          assert {r['current'] for r in rows} == {1, -1, 2e-8, -2e-8, 7, -7}
          for r in rows:
              assert (r['component_count'], r['pair_count'], r['interface_count'], r['port_count']) == (69, 2346, 62, 8)
              assert r['continuous_common_similarity_clearance']
              assert r['minimum_scale'] == 0.9 and r['minimum_deformation_determinant'] > 0.728
              assert r['maximum_relative_cut_error'] < 1e-10
              assert not r['relative_folding_validated']
              assert not r['emergent_motion_validated'] and not r['material_energy_validated']
          PY
