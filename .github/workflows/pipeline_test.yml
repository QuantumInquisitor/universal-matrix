name: Universal Matrix CI/CD Pipeline Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-matrix-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Syntax & Compilation Checks (py_compile)
      run: |
        python -m compileall src/ scripts/

    - name: Run Environment Auditor
      run: |
        python scripts/verify_env.py

    - name: Execute Automated Unit Tests
      run: |
        python -m unittest discover -s tests -p "test_*.py"

    - name: Headless Pipeline Smoke Test
      run: |
        python src/run_field_simulation.py --headless --no-api