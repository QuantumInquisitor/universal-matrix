name: Universal Matrix Container Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest-known"
          enable-cache: true

      - name: Install API verification environment
        run: uv sync --group test --extra api --extra scientific

      - name: Compile
        run: uv run python -m compileall -q src scripts tests

      - name: API import smoke test
        env:
          UNIVERSAL_MATRIX_API_KEYS: "ci-only-key:CI"
        run: |
          uv run python -c "from src.api_server import app; assert app.title"
          uv run python -c "from src.unified_engine import UnifiedMatrixGaugeEngine; print('unified engine import ok')"

      - name: Build research API container
        run: docker build --pull -t universal-matrix:test .

      - name: Container health smoke test
        run: |
          docker run -d --rm             --name universal-matrix-test             -e UNIVERSAL_MATRIX_API_KEYS="ci-only-key:CI"             -p 127.0.0.1:18000:8000             universal-matrix:test
          trap 'docker stop universal-matrix-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs universal-matrix-test
          exit 1

  publish-container-image:
    needs: container-smoke
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract immutable image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ is_default_branch }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
