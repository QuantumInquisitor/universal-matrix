name: Recursive drive/load replay

on:
  pull_request:
    paths:
      - 'scripts/report_fold_recursive_drive_load_replay.py'
      - 'tests/test_fold_recursive_drive_load_replay.py'
      - 'docs/fold_recursive_drive_load_replay.md'
      - '.github/workflows/recursive-drive-load-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recursive-drive-load:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --python 3.12 --extra scientific --group test --group lint
      - name: Verify recursive drive-history and loading replay
        run: |
          uv run --python 3.12 --extra scientific ruff check scripts/report_fold_recursive_drive_load_replay.py tests/test_fold_recursive_drive_load_replay.py
          uv run --python 3.12 --extra scientific ruff format --check scripts/report_fold_recursive_drive_load_replay.py tests/test_fold_recursive_drive_load_replay.py
          uv run --python 3.12 --extra scientific python -m pytest tests/test_fold_recursive_drive_load_replay.py
          uv run --python 3.12 --extra scientific python scripts/report_fold_recursive_drive_load_replay.py --output artifacts/fold-recursive-replay/report.json
          uv run --python 3.12 --extra scientific python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          r = json.loads(Path('artifacts/fold-recursive-replay/report.json').read_text(encoding='utf-8'))
          json.dumps(r, allow_nan=False)
          for name, digest in r['sources'].items():
              assert digest == hashlib.sha256(Path('scripts', name).read_bytes()).hexdigest()
          full = r['full_tree_energy']
          assert max(full['max_node_residual_j']) < 1e-10
          assert max(full['max_edge_residual_j']) < 1e-10
          assert max(full['max_group_residual_j'].values()) < 1e-10
          for case in r['cases'].values():
              assert case['free']['max_energy_balance_residual_j'] < 1e-10
              assert case['loaded']['max_energy_balance_residual_j'] < 1e-10
              for row in case['comparisons'].values():
                  assert row['loaded_root_coordinate_error'] < 1e-5
                  assert row['loaded_root_rate_error'] < 1e-4
          assert not r['connector_coefficients_changed']
          assert not r['material_scaling_law_changed']
          assert not r['new_recursive_coupling_introduced']
          print(json.dumps(r['cases'], sort_keys=True))
          PY
