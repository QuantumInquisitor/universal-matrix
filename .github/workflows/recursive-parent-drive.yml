name: Recursive parent drive audit

on:
  pull_request:
    paths:
      - 'scripts/report_fold_recursive_parent_drive.py'
      - 'tests/test_fold_recursive_parent_drive.py'
      - 'docs/fold_recursive_parent_drive.md'
      - '.github/workflows/recursive-parent-drive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recursive-parent-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --python 3.12 --extra scientific --group lint
      - name: Reproduce recursive parent drive audit once
        run: |
          uv run --python 3.12 --extra scientific ruff check scripts/report_fold_recursive_parent_drive.py tests/test_fold_recursive_parent_drive.py
          uv run --python 3.12 --extra scientific ruff format --check scripts/report_fold_recursive_parent_drive.py tests/test_fold_recursive_parent_drive.py
          uv run --python 3.12 --extra scientific python scripts/report_fold_recursive_parent_drive.py --output artifacts/fold-recursive-parent-drive/report.json
          uv run --python 3.12 --extra scientific python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          r = json.loads(Path('artifacts/fold-recursive-parent-drive/report.json').read_text(encoding='utf-8'))
          json.dumps(r, allow_nan=False)
          for name, digest in r['sources'].items():
              assert digest == hashlib.sha256(Path('scripts', name).read_bytes()).hexdigest()
          full = r['full_tree_energy']
          assert max(full['max_node_residual_j']) < 1e-10
          assert max(full['max_edge_residual_j']) < 1e-10
          assert max(full['max_group_residual_j'].values()) < 1e-10
          assert not r['connector_coefficients_changed']
          assert not r['material_scaling_law_changed']
          assert not r['new_recursive_coupling_introduced']
          print(json.dumps(r['cases'], sort_keys=True))
          PY
